apiVersion: v1
kind: ConfigMap
metadata:
  name: sashiko-self-entrypoint
  namespace: sashiko-self
data:
  sashiko-self-entrypoint.sh: |
    #!/bin/bash
    #
    # Entrypoint for the instance that reviews Sashiko itself.
    #
    # The image entrypoint exists to provision the Linux kernel tree, which
    # takes gigabytes and an hour. This instance reviews one small repository
    # instead, so the clone is done inline: the server is useless until the
    # tree it reviews exists, and a failure here should stop the container
    # rather than surface later as an unexplained review error.
    set -euo pipefail

    REPO_DIR="${SASHIKO__GIT__REPOSITORY_PATH:-/app/third_party/sashiko}"
    REPO_URL="${SASHIKO_SELF_REPOSITORY_URL:-https://github.com/sashiko-dev/sashiko.git}"

    mkdir -p /data/db "$(dirname "$REPO_DIR")"

    # The volume is owned by the fsGroup while the process runs as root, and
    # git refuses to work in a tree it considers owned by someone else.
    git config --global --add safe.directory "$REPO_DIR"

    if [ ! -d "$REPO_DIR/.git" ]; then
        echo "Cloning ${REPO_URL} into ${REPO_DIR}..."
        git clone "$REPO_URL" "$REPO_DIR"
    else
        echo "Updating the existing clone in ${REPO_DIR}..."
        git -C "$REPO_DIR" remote set-url origin "$REPO_URL"
        git -C "$REPO_DIR" fetch --prune origin \
            || echo "Warning: fetch failed, continuing with the existing clone."
        git -C "$REPO_DIR" gc --auto || true
    fi

    # Every relative path in the settings resolves against /app.
    cd /app

    echo "Starting Sashiko (self-review instance)..."
    exec /usr/local/bin/sashiko "$@"
